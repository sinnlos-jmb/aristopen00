<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GEM · Aristóteles</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Tema y sidebar antes del primer pintado (evita el parpadeo claro/oscuro) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('aristoteles.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('aristoteles.sidebar.collapsed') === 'true')
          document.documentElement.style.setProperty('--sidebar-current-w', '72px');
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/css/ux-compact.css" />
  <link rel="stylesheet" href="/css/views.css" />

  <!-- main.js importa shell.js: sidebar, tema, breadcrumbs y scroll dinámico -->
  <script type="module" src="/js/main.js"></script>
</head>
<body>

  <!-- ========================================================================
       SIDEBAR COLAPSABLE (Nuevo Layout)
       ======================================================================== -->
  <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
    <div class="sidebar__brand" id="sidebarBrand" role="button" tabindex="0" aria-label="Colapsar o expandir la barra lateral" aria-expanded="true">
      <div class="sidebar__brand-mark" aria-hidden="true">Α</div>
      <span class="sidebar__brand-text">Ágora</span>
    </div>

    <nav class="sidebar__nav" aria-label="Secciones">
      <a href="#/" class="nav-item active" data-nav="home">
        <span class="nav-item__icon" aria-hidden="true">🏛</span>
        <span class="nav-item__label">Portada</span>
      </a>
      <a href="#/chat" class="nav-item" data-nav="chat">
        <span class="nav-item__icon" aria-hidden="true">💬</span>
        <span class="nav-item__label">Diálogo</span>
      </a>
      <a href="#/reading" class="nav-item" data-nav="reading">
        <span class="nav-item__icon" aria-hidden="true">📖</span>
        <span class="nav-item__label">Lectura</span>
      </a>
      <a href="#/grafos" class="nav-item" data-nav="grafos">
        <span class="nav-item__icon" aria-hidden="true">🕸</span>
        <span class="nav-item__label">Grafos</span>
      </a>
      <a href="#/lab" class="nav-item" data-nav="lab">
        <span class="nav-item__icon" aria-hidden="true">🔬</span>
        <span class="nav-item__label">Laboratorio</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__actions">
        <div class="sidebar__action">
          <span class="sidebar__action-icon" aria-hidden="true">⚡</span>
          <span class="sidebar__action-label" id="status">Cargando…</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Toggle móvil -->
  <button class="sidebar__toggle" id="sidebarToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line>
    </svg>
  </button>

  <!-- ========================================================================
       APP SHELL: Header + Main 
       ======================================================================== -->
  <div class="app-shell">
    
    <!-- Header moderno -->
    <header class="header">
      <div class="header__left">
        <h1 class="header__title">Ética Nicomaquea</h1>
        <div class="header__divider"></div>
        <nav class="header__breadcrumbs" id="breadcrumbs">
          <span class="breadcrumb current">Portada</span>
        </nav>
      </div>
      <div class="header__right">
        <button type="button" class="header__action header__theme-toggle" id="themeToggle" aria-label="Cambiar a tema oscuro" title="Tema actual: claro"></button>
        <div class="header__avatar" aria-hidden="true">A</div>
      </div>
    </header>

    <!-- Main Content: El Router inyectará las vistas en "viewContainer" -->
    <main class="main" role="main">
      <div class="view-container" id="viewContainer">
        <!-- El router monta acá las vistas (Landing, Chat, Lab…) -->
        <div id="app"></div>
      </div>
    </main>

  </div>

</body>
</html>
